<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    
    <title>Document</title>
</head>
<body>
    <header>
        <h2>Núbia Cuidados</h2>
    </header>
    <section id="perfil">
        <img class="nudiaPhoto" src="https://srv-estaticos.vercel.app/Nubia%20Cuidados.jpg" alt="Imagem do perfil Núbia Cuidados">
        <div class="button-container">
            <button onclick="window.open('https://api.whatsapp.com/send?phone=5511999999999&text=Ol%C3%A1%2C%20gostaria%20de%20iniciar%20um%20atendimento.', '_blank')">
                <h3>INICIAR ATENDIMENTO</h3>
            </button>
        </div>
    </section>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: "Libre Baskerville", serif;
        }
        header{
            background-color: #f2f2f2;
            padding: 10px;
            text-align: center;
        }
        header h2{
            font-family: "Libre Baskerville", serif;
            color: #D4AF37;
            font-size: 24px;
        }
        #perfil{
            width: 100%;
            background-color: #d2b8b8;
            padding: 20px;
        }
        .nudiaPhoto{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            display: block;
            margin: 0 auto;
        }
        .button-container{
            text-align: center;
            margin-top: 10px;
            border-bottom: none;
        }
        button{
            background-color: #D4AF37;
            border: none;
            padding: 10px 20px;

            cursor: pointer;
            border-radius: 5px;
        }
        button, h3{
            font-family: "Libre Baskerville", serif;
            color: #f2f2f2;
            font-size: 10px;
        }
    </style>
</body>
</html>
